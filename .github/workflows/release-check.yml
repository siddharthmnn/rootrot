name: rootrot release check

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    name: validate tagged source
    runs-on: ubuntu-latest
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: set up python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
          cache: pip

      - name: validate tag against project version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os, tomllib; from pathlib import Path; version=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; tag=os.environ["RELEASE_TAG"]; expected=f"v{version}"; assert tag == expected, f"tag {tag!r} does not match project version {expected!r}"'

      - name: install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: run release test suite
        run: python -m unittest discover -s tests -v

      - name: build distributions
        run: python -m build

      - name: check distribution metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/verify_dist.py dist

      - name: publish
        run: echo "validation only - publishing is intentionally not configured"
